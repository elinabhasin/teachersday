<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Teacher's Day ❤️</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;justify-content:center;align-items:center;font-family:Arial,sans-serif;background:linear-gradient(135deg,#fff1f2,#ffe4e6,#fdf2f8);overflow:hidden;color:#3f1720}.card{width:min(92vw,520px);padding:42px 30px;text-align:center;background:rgba(255,255,255,.94);border-radius:28px;box-shadow:0 18px 50px rgba(80,20,35,.18);position:relative;z-index:2}.emoji{font-size:52px;margin-bottom:12px}h1{margin:0 0 16px;font-size:clamp(28px,7vw,40px)}p{font-size:18px;line-height:1.5;margin:0 0 28px}#noMessage{font-size:15px;color:#9f1239;font-weight:700;margin:-16px 0 24px;min-height:22px;font-style:italic}.buttons{display:flex;justify-content:center;gap:16px;flex-wrap:wrap;min-height:54px}button{border:none;padding:14px 25px;border-radius:999px;font-size:17px;font-weight:700;cursor:pointer;transition:transform .35s ease,box-shadow .2s ease,opacity .35s ease}#yesBtn{background:#e11d48;color:white;box-shadow:0 8px 20px rgba(225,29,72,.28)}#noBtn{background:#f3f4f6;color:#374151;position:relative}.hidden{display:none}.heart{position:fixed;bottom:-30px;font-size:22px;animation:floatUp linear forwards;opacity:.75;z-index:1;pointer-events:none}@keyframes floatUp{from{transform:translateY(0) rotate(0);opacity:0}15%{opacity:.75}to{transform:translateY(-110vh) rotate(360deg);opacity:0}}.confetti{position:fixed;width:9px;height:14px;top:-20px;z-index:10;animation:fall 2.8s linear forwards;pointer-events:none}@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}@media(max-width:480px){.card{padding:34px 22px}p{font-size:17px}button{width:130px}}</style></head><body><div class="card" id="questionCard"><div class="emoji">🥹❤️</div><h1>Sir…</h1><p id="question">Do you accept that you are the best teacher?</p><p id="noMessage"></p><div class="buttons"><button id="yesBtn">YES 😌</button><button id="noBtn">NO 🙄</button></div></div><div class="card hidden" id="finalCard"><div class="emoji">🏆❤️</div><h1>Exactly. 😌</h1><p>I knew you would eventually accept the truth.<br><br>Happy Teacher’s Day, Sir! ❤️<br><br>Love you, Sir. ❤️</p></div><script>const noBtn=document.getElementById('noBtn'),yesBtn=document.getElementById('yesBtn'),questionCard=document.getElementById('questionCard'),finalCard=document.getElementById('finalCard');const noMessages=['Sir, it’s literally Teacher’s Day. Please cooperate.','This is your one day to accept compliments. Don’t ruin it.','You’re really going to reject a Teacher’s Day compliment?','Fine. I’ll accept the answer on your behalf. 😌'];let noCount=0;let noBase={x:0,y:0,scale:1};let yesScale=1;function applyNo(){noBtn.style.transform=`translate(${noBase.x}px,${noBase.y}px) scale(${noBase.scale})`}function applyYes(){yesBtn.style.transform=`scale(${yesScale})`}function shakeNo(){const base=`translate(${noBase.x}px,${noBase.y}px) scale(${noBase.scale})`;const seq=[10,-10,7,-7,4,-4,0];seq.forEach((d,i)=>setTimeout(()=>{noBtn.style.transform=base+` translateX(${d}px) rotate(${d/2}deg)`},i*40))}noBtn.addEventListener('mouseenter',()=>{if(noCount>=3)return;const dx=Math.random()*70-35,dy=Math.random()*34-17,rot=Math.random()*18-9;noBtn.style.transition='transform .18s ease';noBtn.style.transform=`translate(${noBase.x+dx}px,${noBase.y+dy}px) scale(${noBase.scale}) rotate(${rot}deg)`});noBtn.addEventListener('mouseleave',()=>{noBtn.style.transition='transform .3s cubic-bezier(.34,1.56,.64,1)';applyNo()});noBtn.addEventListener('click',()=>{noCount++;document.getElementById('noMessage').textContent=noMessages[Math.min(noCount,4)-1];if(noCount<4){noBase.scale=1-noCount*0.2;yesScale=1+noCount*0.22;noBase.x=Math.random()*24-12;noBase.y=Math.random()*10-5;noBtn.style.transition='transform .25s cubic-bezier(.34,1.56,.64,1)';applyYes();shakeNo()}else{noBtn.style.transition='transform .45s cubic-bezier(.36,0,.66,-0.56),opacity .35s ease';noBtn.style.transform='scale(0) rotate(400deg)';noBtn.style.opacity='0';noBtn.style.pointerEvents='none';yesScale=1.25;applyYes();setTimeout(()=>{noBtn.style.display='none'},450)}});yesBtn.addEventListener('click',accept);function accept(){questionCard.classList.add('hidden');finalCard.classList.remove('hidden');launchConfetti()}function launchConfetti(){for(let i=0;i<140;i++){const p=document.createElement('div');p.className='confetti';p.style.left=Math.random()*100+'vw';p.style.animationDelay=Math.random()*1.2+'s';p.style.animationDuration=2+Math.random()*2+'s';p.style.background=`hsl(${Math.random()*360},85%,60%)`;p.style.transform=`rotate(${Math.random()*360}deg)`;document.body.appendChild(p);setTimeout(()=>p.remove(),5000)}}setInterval(()=>{const h=document.createElement('div');h.className='heart';h.textContent=Math.random()>.5?'❤️':'💕';h.style.left=Math.random()*100+'vw';h.style.animationDuration=5+Math.random()*5+'s';document.body.appendChild(h);setTimeout(()=>h.remove(),11000)},700);</script></body></html>
