<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Teacher's Day ❤️</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;justify-content:center;align-items:center;font-family:Arial,sans-serif;background:linear-gradient(135deg,#fff1f2,#ffe4e6,#fdf2f8);overflow:hidden;color:#3f1720}.card{width:min(92vw,520px);padding:42px 30px;text-align:center;background:rgba(255,255,255,.94);border-radius:28px;box-shadow:0 18px 50px rgba(80,20,35,.18);position:relative;z-index:2}.emoji{font-size:52px;margin-bottom:12px}h1{margin:0 0 16px;font-size:clamp(28px,7vw,40px)}p{font-size:18px;line-height:1.5;margin:0 0 28px}#noMessage{font-size:15px;color:#9f1239;font-weight:700;margin:-16px 0 24px;min-height:22px;font-style:italic}.buttons{display:flex;justify-content:center;gap:16px;flex-wrap:wrap;min-height:54px}button{border:none;padding:14px 25px;border-radius:999px;font-size:17px;font-weight:700;cursor:pointer;transition:transform .2s ease,box-shadow .2s ease}#yesBtn{background:#e11d48;color:white;box-shadow:0 8px 20px rgba(225,29,72,.28)}#yesBtn:hover{transform:scale(1.06)}#noBtn{background:#f3f4f6;color:#374151;position:relative}.hidden{display:none}.heart{position:fixed;bottom:-30px;font-size:22px;animation:floatUp linear forwards;opacity:.75;z-index:1;pointer-events:none}@keyframes floatUp{from{transform:translateY(0) rotate(0);opacity:0}15%{opacity:.75}to{transform:translateY(-110vh) rotate(360deg);opacity:0}}.confetti{position:fixed;width:9px;height:14px;top:-20px;z-index:10;animation:fall 2.8s linear forwards;pointer-events:none}@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}@media(max-width:480px){.card{padding:34px 22px}p{font-size:17px}button{width:130px}}</style></head><body><div class="card" id="questionCard"><div class="emoji">🥹❤️</div><h1>Sir…</h1><p id="question">Do you accept that you are the best teacher?</p><p id="noMessage"></p><div class="buttons"><button id="yesBtn">YES 😌</button><button id="noBtn">NO 🙄</button></div></div><div class="card hidden" id="finalCard"><div class="emoji">🏆❤️</div><h1>Exactly. 😌</h1><p>I knew you would eventually accept the truth.<br><br>Happy Teacher’s Day, Sir! ❤️<br><br>Love you, Sir. ❤️</p></div><script>const noBtn=document.getElementById('noBtn'),yesBtn=document.getElementById('yesBtn'),questionCard=document.getElementById('questionCard'),finalCard=document.getElementById('finalCard');const noMessages=['Sir, it’s literally Teacher’s Day. Please cooperate.','This is your one day to accept compliments. Don’t ruin it.','You’re really going to reject a Teacher’s Day compliment?','Fine. I’ll accept the answer on your behalf. 😌'];let noCount=0;noBtn.addEventListener('click',()=>{noCount++;if(noCount<4){document.getElementById('noMessage').textContent=noMessages[noCount-1];const r=questionCard.getBoundingClientRect();
let x,y;
if(window.innerWidth<=600){
const positions=[{x:-95,y:85},{x:95,y:115},{x:-105,y:145}];
({x,y}=positions[noCount-1]);
}else{
const positions=[{x:-150,y:85},{x:150,y:115},{x:-165,y:145}];
({x,y}=positions[noCount-1]);
}
noBtn.style.transform=`translate(${x}px,${y}px)`}else{document.getElementById('noMessage').textContent=noMessages[3];noBtn.textContent='YES 😌';noBtn.style.background='#e11d48';noBtn.style.color='white';noBtn.style.transform='none';noBtn.onclick=accept}});yesBtn.addEventListener('click',accept);function accept(){questionCard.classList.add('hidden');finalCard.classList.remove('hidden');launchConfetti()}function launchConfetti(){for(let i=0;i<140;i++){const p=document.createElement('div');p.className='confetti';p.style.left=Math.random()*100+'vw';p.style.animationDelay=Math.random()*1.2+'s';p.style.animationDuration=2+Math.random()*2+'s';p.style.background=`hsl(${Math.random()*360},85%,60%)`;p.style.transform=`rotate(${Math.random()*360}deg)`;document.body.appendChild(p);setTimeout(()=>p.remove(),5000)}}setInterval(()=>{const h=document.createElement('div');h.className='heart';h.textContent=Math.random()>.5?'❤️':'💕';h.style.left=Math.random()*100+'vw';h.style.animationDuration=5+Math.random()*5+'s';document.body.appendChild(h);setTimeout(()=>h.remove(),11000)},700);</script></body></html>
